[build]
builder = "NIXPACKS"

[build.env]
NIXPACKS_METADATA = "php,laravel"

[build.variables]
PHP_VERSION = "8.3"
NODE_VERSION = "22"

[deploy]
startCommand = "bash railway/init-app.sh"

[deploy.variables]
APP_ENV = "production"
APP_DEBUG = "false"
APP_URL = "https://mralbin.xyz"
ASSET_URL = "https://mralbin.xyz"
FORCE_HTTPS = "true"
LOG_CHANNEL = "stderr"
DB_CONNECTION = "sqlite"
SESSION_DRIVER = "database"
CACHE_DRIVER = "database"
QUEUE_CONNECTION = "database"
BROADCAST_DRIVER = "log"
FILESYSTEM_DISK = "public"