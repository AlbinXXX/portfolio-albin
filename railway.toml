[build]
nixpkgs = ["php82", "nodejs-18_x", "php82Extensions.zip", "php82Extensions.curl", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.sqlite3", "php82Extensions.pdo_sqlite", "php82Extensions.pdo_mysql", "php82Extensions.gd", "php82Extensions.fileinfo"]

[build.buildCommand]
buildCommand = "composer install --no-dev --optimize-autoloader --ignore-platform-reqs && npm install && npm run build"

[deploy]
startCommand = "php artisan migrate --force && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10