# Railway Deployment Configuration

# Build command
build = "composer install --no-dev --optimize-autoloader && npm install && npm run build"

# Start command  
start = "php artisan migrate --force && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT"

[variables]
APP_ENV = "production"
APP_DEBUG = "false"
LOG_CHANNEL = "stack"
DB_CONNECTION = "mysql"